name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain
        run: rustup show active-toolchain
      - run: npm ci
      - run: npm run check:lines
      - run: npm run format:check
      - run: npm run ui:typecheck
      - run: npm run test:fixtures
      - run: npm run test:pdf-text
      - run: npm run rust:fmt
      - run: npm run engine:test
      - run: npm run test:execution-engine
      - run: npm run test:tools-engine
      - run: npm run test:teams-engine
      - run: npm run build
      - run: npm run rust:check
      - name: Windows UI and browser probes
        if: runner.os == 'Windows'
        run: |
          npm run test:office-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:models-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:execution-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:tools-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:teams-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workspace-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:task-archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:task-archive-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workbench-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workbench-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run browser:prepare-companion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File scripts/register-browser-companion.ps1 -Browser chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File scripts/register-browser-companion.ps1 -Browser edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser-companion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: .test-results
          include-hidden-files: true
          if-no-files-found: ignore

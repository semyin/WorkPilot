<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkPilot · 工作台交互提案</title>
    <link rel="icon" href="../../assets/icons/png/32.png" />
    <link rel="stylesheet" href="workbench.css" />
    <link rel="stylesheet" href="workspace.css" />
    <link rel="stylesheet" href="overlays.css" />
    <link rel="stylesheet" href="motion.css" />
    <link rel="stylesheet" href="menus.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="search.css" />
    <link rel="stylesheet" href="workspace-controls.css" />
    <script src="icons.js" defer></script>
    <script src="preview-model.js" defer></script>
    <script src="motion.js" defer></script>
    <script src="menus.js" defer></script>
    <script src="workbench.js" defer></script>
    <script src="settings.js" defer></script>
    <script src="task-navigation.js" defer></script>
    <script src="workspace-controls.js" defer></script>
    <script src="composer-controls.js" defer></script>
    <script src="interactions.js" defer></script>
  </head>
  <body>
    <div class="proposal-bar">
      <span
        ><i></i><span class="proposal-brand">WorkPilot 产品化提案</span>
        <span class="proposal-note">· 示例数据，不执行真实任务</span></span
      >
      <div class="demo-state-control">
        <span>体验状态</span
        ><button
          type="button"
          id="demo-state"
          class="select-trigger compact-select"
          data-dropdown="demo-state"
          aria-label="切换演示状态"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          进行中
        </button>
      </div>
    </div>
    <div class="app-shell" id="shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <img src="../../assets/icons/png/128.png" alt="" /><strong
            >WorkPilot</strong
          ><button
            class="icon-button"
            id="collapse-sidebar"
            aria-label="收起侧栏"
            data-icon="panel-left"
          ></button>
        </div>
        <button class="new-task" id="new-task">
          <span data-icon="plus"></span><span>新建任务</span><kbd>Ctrl + N</kbd>
        </button>
        <nav class="primary-nav">
          <button id="search-open">
            <span data-icon="search"></span><span>搜索</span><kbd>Ctrl + K</kbd>
          </button>
          <button data-page="tasks" class="selected">
            <span data-icon="chat"></span><span>任务</span
            ><span class="nav-count">4</span>
          </button>
          <button data-page="library">
            <span data-icon="files"></span><span>资料库</span>
          </button>
          <button data-page="skills">
            <span data-icon="spark"></span><span>技能与连接</span>
          </button>
          <button data-page="schedules">
            <span data-icon="clock"></span><span>定时任务</span>
          </button>
        </nav>
        <div class="sidebar-scroll">
          <div class="section-caption">
            <span>项目</span
            ><button
              class="icon-button"
              id="add-project"
              aria-label="新建项目"
              data-icon="plus"
            ></button>
          </div>
          <button
            class="project-heading"
            id="project-toggle"
            aria-expanded="true"
          >
            <span data-icon="chevron-down"></span
            ><span data-icon="folder"></span><span>WorkPilot</span
            ><small>3</small>
          </button>
          <div id="project-tasks" class="project-tasks">
            <button class="task-link current" data-task="design">
              <span class="task-dot live"></span><span>重做产品工作台</span
              ><small>现在</small>
            </button>
            <button class="task-link" data-task="files">
              <span data-icon="check"></span><span>整理项目资料</span
              ><small>昨天</small>
            </button>
            <button class="task-link" data-task="code">
              <span data-icon="check"></span><span>检查代码与文档</span
              ><small>周一</small>
            </button>
          </div>
          <button class="project-heading" id="personal-project">
            <span data-icon="chevron-right"></span
            ><span data-icon="folder"></span><span>个人工作</span
            ><small>1</small>
          </button>
          <div class="section-caption recent-caption">最近的独立任务</div>
          <button class="task-link independent" data-task="research">
            <span data-icon="chat"></span><span>整理阅读笔记</span>
          </button>
        </div>
        <div class="sidebar-bottom">
          <button id="settings-open">
            <span data-icon="settings"></span><span>设置</span>
          </button>
          <div class="local-space">
            <span class="avatar">S</span>
            <div><strong>个人空间</strong><small>保存在本机</small></div>
            <span class="status-dot"></span>
          </div>
        </div>
      </aside>
      <main class="workspace">
        <header class="workspace-header">
          <div class="header-title">
            <button
              class="icon-button restore-sidebar"
              id="restore-sidebar"
              aria-label="展开侧栏"
              data-icon="panel-left"
            ></button>
            <div>
              <div class="breadcrumb" id="breadcrumb">
                WorkPilot <span>/</span> 任务
              </div>
              <h1 id="task-title">重做产品工作台</h1>
            </div>
          </div>
          <div class="header-actions">
            <span id="task-status" class="status-badge"></span>
            <button
              class="icon-button notification-button"
              id="notifications-open"
              aria-label="通知，1 条未读"
              title="通知"
            >
              <span data-icon="bell"></span><i class="notification-dot"></i>
            </button>
            <button
              class="icon-button"
              id="workspace-open"
              aria-label="打开任务工作区"
              title="成果、文件与执行过程"
              data-icon="panel-right"
            ></button>
          </div>
        </header>
        <div class="conversation-scroll" id="conversation-scroll">
          <div id="conversation" class="conversation"></div>
        </div>
        <footer id="composer-area" class="composer-area">
          <div id="queue-list" class="queue-list"></div>
          <form id="composer" class="composer">
            <div id="attachment-list" class="attachment-list"></div>
            <textarea
              id="message"
              rows="2"
              aria-label="输入任务要求"
              placeholder="补充要求，或把文件拖到这里…"
            ></textarea>
            <div class="composer-toolbar">
              <div class="composer-options composer-left">
                <button
                  type="button"
                  class="icon-button"
                  id="attach"
                  aria-label="添加附件"
                  data-icon="plus"
                ></button>
                <button
                  type="button"
                  class="option permission"
                  id="permission-menu"
                >
                  <span data-icon="shield"></span
                  ><span id="permission-label">请求审批</span
                  ><span data-icon="chevron-down"></span>
                </button>
                <button type="button" class="option" id="mode-menu">
                  <span id="mode-label">直接执行</span
                  ><span data-icon="chevron-down"></span>
                </button>
              </div>
              <div class="composer-options composer-right">
                <button
                  type="button"
                  class="context-ring"
                  id="context-ring"
                  aria-label="查看上下文使用情况"
                  aria-haspopup="dialog"
                  aria-expanded="false"
                ></button>
                <button type="button" class="option" id="model-menu">
                  <span id="model-label">Qwen</span
                  ><span data-icon="chevron-down"></span>
                </button>
                <button
                  type="button"
                  class="option thinking-option"
                  id="thinking-menu"
                >
                  <span id="thinking-label">思考：中</span
                  ><span data-icon="chevron-down"></span>
                </button>
                <button
                  type="submit"
                  class="send-button"
                  id="send"
                  aria-label="停止任务"
                  data-icon="stop"
                ></button>
              </div>
            </div>
          </form>
          <div class="composer-hint">
            <span id="compose-hint">运行时发送的要求会排队，可选择立即引导</span
            ><span>Enter 发送 · Shift Enter 换行</span>
          </div>
        </footer>
        <input type="file" id="file-input" multiple hidden />
      </main>
      <aside class="work-panel" id="work-panel" aria-label="任务工作区" hidden>
        <div
          id="panel-resize"
          class="panel-resize"
          role="separator"
          aria-label="调整工作区宽度"
          aria-orientation="vertical"
          tabindex="0"
          title="拖动调整宽度 · 双击恢复默认"
        ></div>
        <div class="panel-heading">
          <strong>工作区</strong
          ><button
            class="icon-button"
            id="panel-close"
            aria-label="关闭工作区"
            data-icon="close"
          ></button>
        </div>
        <nav class="panel-tabs" aria-label="工作区内容">
          <button data-panel="artifacts" class="active">成果</button
          ><button data-panel="files">文件</button
          ><button data-panel="activity">过程</button>
        </nav>
        <div id="panel-content" class="panel-content"></div>
      </aside>
    </div>
    <div id="popover" class="popover" hidden></div>
    <dialog
      id="search-dialog"
      class="command-dialog"
      aria-label="搜索任务"
    ></dialog>
    <dialog id="dialog"><div id="dialog-body"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>

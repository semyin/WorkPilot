[workspace]
members = ["crates/contracts", "crates/platform", "crates/storage", "crates/providers", "crates/policy", "crates/tools", "crates/extensions", "crates/office", "crates/workbench", "crates/runtime", "crates/engine", "crates/browser-bridge", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.12.10"
edition = "2024"
rust-version = "1.99"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time", "signal"] }
thiserror = "=2.0.21"
directories = "=6.0.0"
tempfile = "=3.27.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "fallible_uint"] }
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
zeroize = "=1.8.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
futures-util = "=0.3.34"
url = "=2.5.8"
cap-std = "=4.0.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
